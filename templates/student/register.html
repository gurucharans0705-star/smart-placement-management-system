{% extends "base.html" %}
{% block title %}Student Register{% endblock %}

{% block content %}
<div class="card auth-card">
    <h3 class="text-center mb-4">Student Registration</h3>

    <form method="POST" action="{{ url_for('auth.student_register') }}">
        <div class="mb-3">
            <label class="form-label">Full Name</label>
            <input type="text" name="full_name" class="form-control" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Email address</label>
            <input type="email" name="email" class="form-control" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Password</label>
            <input type="password" name="password" class="form-control" required minlength="6">
        </div>

        <div class="mb-3">
            <label class="form-label">Department</label>
            <select name="department" class="form-select" required>
                <option value="" disabled selected>Select department</option>
                <option value="CSE">CSE</option>
                <option value="IT">IT</option>
                <option value="ECE">ECE</option>
                <option value="EEE">EEE</option>
                <option value="MECH">MECH</option>
                <option value="CIVIL">CIVIL</option>
            </select>
        </div>

        <div class="row">
            <div class="col mb-3">
                <label class="form-label">CGPA</label>
                <input type="number" step="0.01" min="0" max="10" name="cgpa" class="form-control" required>
            </div>
            <div class="col mb-3">
                <label class="form-label">Active Backlogs</label>
                <input type="number" min="0" name="backlogs" value="0" class="form-control" required>
            </div>
        </div>

        <button type="submit" class="btn btn-primary w-100">Register</button>
    </form>

    <p class="text-center mt-3">
        Already have an account? <a href="{{ url_for('auth.student_login') }}">Login here</a>
    </p>
</div>
{% endblock %}
