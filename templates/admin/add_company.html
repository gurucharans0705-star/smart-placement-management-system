{% extends "base.html" %}
{% block title %}Add Company{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
    <h3 class="mb-0">Add Company</h3>
    <a href="{{ url_for('admin.companies') }}" class="btn btn-outline-secondary">
        <i class="bi bi-arrow-left"></i> Back to Companies
    </a>
</div>

<div class="card p-4">
    <form method="POST" action="{{ url_for('admin.add_company') }}">

        <div class="row g-3">
            <div class="col-md-6">
                <label class="form-label">Company Name</label>
                <input type="text" name="company_name" class="form-control"
                       value="{{ form.company_name or '' }}" required>
            </div>
            <div class="col-md-6">
                <label class="form-label">Job Role</label>
                <input type="text" name="job_role" class="form-control"
                       value="{{ form.job_role or '' }}" required>
            </div>

            <div class="col-md-4">
                <label class="form-label">Package (LPA)</label>
                <input type="number" step="0.01" min="0" name="package_lpa" class="form-control"
                       value="{{ form.package_lpa or '' }}" required>
            </div>
            <div class="col-md-4">
                <label class="form-label">Location</label>
                <input type="text" name="location" class="form-control"
                       value="{{ form.location or '' }}" required>
            </div>
            <div class="col-md-4">
                <label class="form-label">Application Deadline</label>
                <input type="date" name="last_date" class="form-control"
                       value="{{ form.last_date or '' }}" required>
            </div>

            <div class="col-md-4">
                <label class="form-label">Minimum CGPA</label>
                <input type="number" step="0.01" min="0" max="10" name="min_cgpa" class="form-control"
                       value="{{ form.min_cgpa or '' }}" required>
            </div>
            <div class="col-md-4">
                <label class="form-label">Maximum Backlogs</label>
                <input type="number" min="0" name="max_backlogs" class="form-control"
                       value="{{ form.max_backlogs if form.max_backlogs is defined else 0 }}" required>
            </div>
            <div class="col-md-4">
                <label class="form-label">Passing Years <small class="text-muted">(optional, e.g. 2026,2027)</small></label>
                <input type="text" name="eligible_batch_years" class="form-control"
                       value="{{ form.eligible_batch_years or '' }}" placeholder="Leave blank = open to all">
            </div>

            <div class="col-md-8">
                <label class="form-label d-block">Eligible Departments</label>
                {% for dept in departments %}
                <div class="form-check form-check-inline">
                    <input class="form-check-input" type="checkbox" name="allowed_departments"
                           value="{{ dept }}" id="dept_{{ dept }}"
                           {% if dept in form.allowed_departments %}checked{% endif %}>
                    <label class="form-check-label" for="dept_{{ dept }}">{{ dept }}</label>
                </div>
                {% endfor %}
            </div>

            <div class="col-md-4">
                <label class="form-label d-block">Status</label>
                <div class="form-check form-check-inline">
                    <input class="form-check-input" type="radio" name="is_active" value="active"
                           id="status_active" {% if not form or form.is_active != 'inactive' %}checked{% endif %}>
                    <label class="form-check-label" for="status_active">Active</label>
                </div>
                <div class="form-check form-check-inline">
                    <input class="form-check-input" type="radio" name="is_active" value="inactive"
                           id="status_inactive" {% if form.is_active == 'inactive' %}checked{% endif %}>
                    <label class="form-check-label" for="status_inactive">Inactive</label>
                </div>
            </div>

            <div class="col-12">
                <label class="form-label">Description</label>
                <textarea name="description" class="form-control" rows="4">{{ form.description or '' }}</textarea>
            </div>
        </div>

        <div class="mt-4 d-flex gap-2">
            <button type="submit" class="btn btn-primary"><i class="bi bi-check-lg"></i> Add Company</button>
            <a href="{{ url_for('admin.companies') }}" class="btn btn-outline-secondary">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
